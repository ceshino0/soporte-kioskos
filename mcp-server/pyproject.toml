[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kioskos-mcp"
version = "1.0.0"
description = "Servidor MCP de soporte de kioskos de autoservicio para restauración (parque + tickets)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.27,<2",
    "pydantic>=2.7,<3",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
kioskos-mcp = "kioskos_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kioskos_mcp = ["seed/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
